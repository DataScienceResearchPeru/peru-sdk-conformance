name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMPDIR: /var/tmp
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - run: python tools/check.py
      - name: Build corpus archive
        run: |
          stage=$(mktemp -d /var/tmp/peru-conformance.XXXXXXXX)
          echo "CORPUS_DIST=$stage" >> "$GITHUB_ENV"
          python tools/build_bundle.py --output "$stage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: conformance-${{ github.sha }}
          path: ${{ env.CORPUS_DIST }}
